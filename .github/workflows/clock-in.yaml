name: Auto Clock-In 9AM (script gates workdays)

on:
  schedule:
    # 目標 08:00 TPE (00:00 UTC)；GitHub 排程實測延遲約 +50 分 → 實際落在 ~09:00。是否真的打卡由 take5-clock.ts 判斷
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  clock-in:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clock in
        env:
          COMPANY_CODE: ${{ secrets.COMPANY_CODE }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          LATITUDE: ${{ secrets.LATITUDE }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
          USE_MACHINE_LOCATION: '1'
        run: npx -y tsx take5-clock.ts in
