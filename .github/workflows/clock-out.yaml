name: Auto Clock-Out 6:20PM (script gates workdays)

on:
  schedule:
    # 目標 18:20 TPE (10:20 UTC)。排程延遲實測已縮到 5~35 分，原本靠延遲補到 18:00 之後的設法
    # 會落在 17:38 前後被判早退，所以直接把目標訂在下班時間之後。是否真的打卡由 take5-clock.ts 判斷
    - cron: '20 10 * * *'
  workflow_dispatch:

jobs:
  clock-out:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clock out
        env:
          COMPANY_CODE: ${{ secrets.COMPANY_CODE }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          LATITUDE: ${{ vars.LATITUDE }}
          LONGITUDE: ${{ vars.LONGITUDE }}
          USE_MACHINE_LOCATION: '0'
        run: npx -y tsx take5-clock.ts out
