name: Auto Clock-Out 6:30PM (script gates workdays)

on:
  schedule:
    # 目標 17:30 TPE (09:30 UTC)；GitHub 排程實測延遲約 +80 分 → 實際落在 ~18:30-19:00（最早不早於 18:00）。是否真的打卡由 take5-clock.ts 判斷
    - cron: '30 9 * * *'
  workflow_dispatch:

jobs:
  clock-out:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clock out
        env:
          COMPANY_CODE: ${{ secrets.COMPANY_CODE }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          LATITUDE: ${{ secrets.LATITUDE }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
          USE_MACHINE_LOCATION: '0'
        run: npx -y tsx take5-clock.ts out
