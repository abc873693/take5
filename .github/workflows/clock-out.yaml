name: Auto Clock-Out 6:30PM (script gates workdays)

on:
  schedule:
    # 每天下午六點半 (UTC+8 = 10:30 UTC)；是否真的打卡由 take5-clock.ts 依班表/加班/請假判斷
    - cron: '30 10 * * *'
  workflow_dispatch:

jobs:
  clock-out:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clock out
        env:
          COMPANY_CODE: ${{ secrets.COMPANY_CODE }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          LATITUDE: ${{ secrets.LATITUDE }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
          USE_MACHINE_LOCATION: '1'
        run: npx -y tsx take5-clock.ts out
